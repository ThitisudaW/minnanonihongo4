<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minna no Nihongo Lesson 4</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --primary-indigo: #6366f1; --accent-rose: #ff6b8b; --glass-bg: rgba(255, 255, 255, 0.82); }
        body { background: #eef2ff; color: #2d3436; min-height: 100vh; padding: 20px; }
        .app-container { max-width: 900px; margin: 0 auto; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { height: 180px; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; border: 1px solid #ddd; background: white; }
        .card-back { background: var(--primary-indigo); color: white; transform: rotateY(180deg); }
        .audio-btn { cursor: pointer; background: #eee; border: none; padding: 8px; border-radius: 50%; margin-bottom: 10px; }
        .jp-hiragana { font-size: 1.6rem; font-weight: 700; color: var(--primary-indigo); }
        .th-meaning { font-size: 1.2rem; font-weight: 600; }
    </style>
</head>
<body>

    <audio id="masterAudio" src="085.mp4" preload="auto"></audio>

    <div class="app-container">
        <h1 style="text-align:center; margin-bottom:20px;">บทที่ 4</h1>
        <div id="cardsGrid" class="cards-grid"></div>
    </div>

    <script>
        // แก้ไขค่า start และ end ที่นี่หากเสียงยังเหลื่อม
        const vocabularyData = [
            { hiragana: "おきます", kanji: "起きます", thai: "ตื่นนอน", start: 2.2, end: 3.5 },
            { hiragana: "ねます", kanji: "寝ます", thai: "นอน", start: 4.1, end: 5.5 },
            { hiragana: "はたらきます", kanji: "働きます", thai: "ทำงาน", start: 6.0, end: 7.5 },
            { hiragana: "やすみます", kanji: "休みます", thai: "พัก", start: 8.0, end: 9.6 },
            { hiragana: "べんきょうします", kanji: "勉強します", thai: "เรียน", start: 10.0, end: 11.8 },
            { hiragana: "おわります", kanji: "終わります", thai: "เสร็จ, เลิก", start: 12.2, end: 13.8 },
            { hiragana: "デパート", kanji: "-", thai: "ห้างสรรพสินค้า", start: 14.2, end: 15.6 },
            { hiragana: "けさ", kanji: "今朝", thai: "เมื่อเช้า", start: 56.5, end: 57.6 },
            { hiragana: "こんばん", kanji: "今晩", thai: "คืนนี้", start: 58.0, end: 59.4 },
            { hiragana: "やすみ", kanji: "休み", thai: "วันหยุด", start: 59.8, end: 61.2 },
            { hiragana: "ニューヨーク", kanji: "-", thai: "นิวยอร์ก", start: 148.0, end: 149.8 },
            { hiragana: "ペキン", kanji: "-", thai: "ปักกิ่ง", start: 150.2, end: 151.5 },
            { hiragana: "ロサンゼルス", kanji: "-", thai: "ลอสแอนเจลิส", start: 152.0, end: 154.2 },
            { hiragana: "ロンドン", kanji: "-", thai: "ลอนดอน", start: 154.5, end: 156.5 }
        ];

        function playAudio(text, start, end) {
            const masterAudio = document.getElementById('masterAudio');
            if (audioTimer) clearTimeout(audioTimer);
            
            masterAudio.pause();
            masterAudio.currentTime = start;
            masterAudio.play().then(() => {
                audioTimer = setTimeout(() => masterAudio.pause(), (end - start) * 1000);
            });
        }

        let audioTimer = null;

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            vocabularyData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <button class="audio-btn" onclick="event.stopPropagation(); playAudio('${item.hiragana}', ${item.start}, ${item.end})">
                                <i data-lucide="volume-2"></i>
                            </button>
                            <div class="jp-hiragana">${item.hiragana}</div>
                            <div style="color:#aaa; font-size:0.9rem;">${item.kanji}</div>
                        </div>
                        <div class="card-back">
                            <div class="th-meaning">${item.thai}</div>
                        </div>
                    </div>
                `;
                card.onclick = () => card.classList.toggle('flipped');
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        window.onload = renderCards;
    </script>
</body>
</html>
