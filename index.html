<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minna no Nihongo Lesson 4 - Modern Animated Japanese Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-indigo: #6366f1;
            --primary-teal: #14b8a6;
            --accent-rose: #ff6b8b;
            --accent-amber: #f59e0b;
            --bg-dark: #0f172a;
            --text-dark: #2d3436;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-card: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.9);
            --shadow-glow: 0 20px 40px rgba(99, 102, 241, 0.15);
            --shadow-card: 0 10px 25px rgba(0, 0, 0, 0.04);
            --radius-xl: 32px;
            --radius-lg: 20px;
            --radius-md: 12px;
            
            /* UD Digi Kyokasho N Font Stack */
            --font-jp: "UD Digi Kyokasho N", "UD デジタル教科書体 N", "Zen Maru Gothic", "Klee One", "Noto Sans JP", sans-serif;
            --font-th: 'Prompt', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-th);
        }

        body {
            background: #eef2ff;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* 🌊 Animated Japanese Traditional Seigaiha Pattern Background */
        .jp-pattern-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: -2;
            opacity: 0.12;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="30" viewBox="0 0 60 30"><path d="M0 15 A15 15 0 0 1 30 15 A15 15 0 0 1 60 15 A15 15 0 0 1 30 15 A15 15 0 0 1 0 15 Z" fill="none" stroke="%234338ca" stroke-width="1.5"/><path d="M-15 0 A15 15 0 0 1 15 0 A15 15 0 0 1 45 0 A15 15 0 0 1 75 0" fill="none" stroke="%234338ca" stroke-width="1.5"/><path d="M-15 30 A15 15 0 0 1 15 30 A15 15 0 0 1 45 30 A15 15 0 0 1 75 30" fill="none" stroke="%234338ca" stroke-width="1.5"/></svg>');
            animation: panPattern 45s linear infinite;
        }

        @keyframes panPattern {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-120px, -60deg) rotate(2deg); }
        }

        /* Ambient Animated Colorful Aurora Glows */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 90% 15%, rgba(244, 63, 94, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 50% 85%, rgba(20, 184, 166, 0.2) 0%, transparent 50%);
            filter: blur(50px);
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.08); }
        }

        /* Floating Japanese Elements */
        .floating-element {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            animation: floatUp 14s linear infinite;
            font-size: 2.2rem;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.25; }
            80% { opacity: 0.25; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .app-container {
            max-width: 1040px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: var(--radius-xl);
            padding: 35px 25px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glow);
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary-indigo);
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            border: 1px solid rgba(99, 102, 241, 0.25);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--primary-indigo);
            font-family: var(--font-jp);
        }

        /* Modern Segmented Navigation Bar */
        .mode-switcher {
            display: flex;
            justify-content: center;
            background: rgba(203, 213, 225, 0.5);
            padding: 6px;
            border-radius: 50px;
            gap: 6px;
            margin-bottom: 30px;
            max-width: 920px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 140px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            white-space: nowrap;
        }

        .mode-btn.active {
            background: #ffffff;
            color: var(--primary-indigo);
            box-shadow: 0 4px 18px rgba(99, 102, 241, 0.18);
            font-weight: 700;
        }

        /* Category Pill Tabs */
        .category-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .nav-tab {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #cbd5e1;
            padding: 8px 18px;
            border-radius: 50px;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background: var(--primary-indigo);
            color: #ffffff;
            border-color: var(--primary-indigo);
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
        }

        /* Toolbar & Controls */
        .stepper-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid #f1f5f9;
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
        }

        .step-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: var(--text-dark);
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .step-btn:hover:not(:disabled) {
            background: var(--primary-indigo);
            color: white;
            border-color: var(--primary-indigo);
        }

        .step-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cat-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .quick-tools {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tool-chip {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .tool-chip:hover {
            border-color: var(--primary-indigo);
            color: var(--primary-indigo);
            background: rgba(99, 102, 241, 0.08);
        }

        /* Glassmorphism Flashcards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            min-height: 320px;
        }

        .card {
            height: 190px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
        }

        .card:hover .card-inner {
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.15);
            transform: translateY(-4deg);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .card-front {
            background: var(--glass-card);
        }

        .jp-hiragana {
            font-family: var(--font-jp);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-indigo);
            margin-bottom: 6px;
        }

        .jp-kanji {
            font-family: var(--font-jp);
            font-size: 1.05rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 3px 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .audio-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: #f8fafc;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .audio-btn:hover {
            background: var(--primary-indigo);
            color: white;
            transform: scale(1.1);
        }

        .card-back {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: white;
            transform: rotateY(180deg);
            gap: 8px;
        }

        .visual-icon { font-size: 2.5rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); }
        .th-meaning { font-size: 1.25rem; font-weight: 600; }

        /* 🍣 VERB GROUPING SECTION */
        .verbs-container {
            display: none;
            background: #ffffff;
            border-radius: var(--radius-lg);
            padding: 30px 20px;
            border: 1px solid #f1f5f9;
            box-shadow: var(--shadow-card);
        }

        .verb-rule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .verb-rule-card {
            border-radius: var(--radius-lg);
            padding: 22px;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .verb-rule-card.g1 { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
        .verb-rule-card.g2 { background: linear-gradient(135deg, #f59e0b, #f97316); }
        .verb-rule-card.g3 { background: linear-gradient(135deg, #8b5cf6, #ec4899); }

        .verb-rule-card h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .verb-rule-card .rule-desc {
            font-size: 0.92rem;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 10px 14px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .verb-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .verb-col {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-lg);
            padding: 18px;
        }

        .verb-col h4 {
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .verb-col.g1 h4 { background: #3b82f6; }
        .verb-col.g2 h4 { background: #f97316; }
        .verb-col.g3 h4 { background: #8b5cf6; }

        .verb-item-box {
            background: white;
            border: 1px solid #f1f5f9;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .verb-item-jp { font-family: var(--font-jp); font-size: 1.25rem; font-weight: 700; color: var(--text-dark); }
